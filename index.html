<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PKMG Missions</title>
  <style>
    html, body {
      margin: 0;
      background: #fff;
    }

    header {
      padding: 12px 16px;
      background: #222;
      color: #fff;
      text-align: center;
      font: 600 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .image-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
    }

    .images {
      display: flex;
      width: max-content;
      align-items: flex-start;
    }

    .images img {
      display: block;
      flex: 0 0 auto;
      width: auto;
      max-width: 100vw;
      height: auto;
    }
  </style>
</head>
<body>
  <header id="date-banner"></header>

  <main class="image-scroll" aria-label="Daily images; scroll horizontally for more">
    <div class="images" id="images"></div>
  </main>

  <script>
    // Use UTC methods after adding 8 hours, so the date is always GMT+8.
    const nowGMT8 = new Date(Date.now() + 8 * 60 * 60 * 1000);
    const year = nowGMT8.getUTCFullYear();
    const month = String(nowGMT8.getUTCMonth() + 1).padStart(2, '0');
    const day = String(nowGMT8.getUTCDate()).padStart(2, '0');
    const date = `${year}${month}${day}`;

    document.getElementById('date-banner').textContent = `${year}-${month}-${day}`;

    const container = document.getElementById('images');

    function addImage(src, number) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = `Image ${number}`;
      container.appendChild(img);
    }

    // The main image is always displayed.
    addImage(`images/${date}.png`, 1);

    // Add images 2 to 8 only if their files exist.
    function loadOptionalImage(number) {
      return new Promise(resolve => {
        const img = new Image();

        img.onload = () => resolve({
          src: `images/${date}-${number}.png`,
          number
        });

        img.onerror = () => resolve(null);

        img.src = `images/${date}-${number}.png`;
      });
    }

    Promise.all(
      Array.from({ length: 7 }, (_, index) => loadOptionalImage(index + 2))
    ).then(results => {
      results.forEach(result => {
        if (result) {
          addImage(result.src, result.number);
        }
      });
    });
  </script>
</body>
</html>
