<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PKMG Missions</title>
  <style>
    html, body {
      margin: 0;
      background: #fff;
    }

    header {
      padding: 12px 16px;
      background: #222;
      color: #fff;
      text-align: center;
      font: 600 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .image-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .images {
      display: flex;
      width: max-content;
      align-items: flex-start;
    }

    .images img {
      display: block;
      flex: 0 0 auto;
      width: min(100vw, 1228px);
      height: auto;
    }
  </style>
</head>
<body>
  <header id="date-banner"></header>
  <main class="image-scroll" aria-label="Daily images; scroll horizontally for more">
    <div class="images" id="images"></div>
  </main>
  <script>
    const nowGMT8 = new Date(Date.now() + 8 * 60 * 60 * 1000);
    const year = nowGMT8.getUTCFullYear();
    const month = String(nowGMT8.getUTCMonth() + 1).padStart(2, '0');
    const day = String(nowGMT8.getUTCDate()).padStart(2, '0');
    const date = `${year}${month}${day}`;

    document.getElementById('date-banner').textContent = `${year}-${month}-${day}`;
    const container = document.getElementById('images');

    const first = document.createElement('img');
    first.src = `images/${date}.png`;
    first.alt = 'Image 1';
    container.appendChild(first);

    function loadOptionalImage(number) {
      return new Promise(resolve => {
        const img = new Image();
        img.alt = `Image ${number}`;
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = `images/${date}-${number}.png`;
      });
    }

    Promise.all(Array.from({ length: 7 }, (_, i) => loadOptionalImage(i + 2)))
      .then(images => {
        images.forEach(img => {
          if (img) container.appendChild(img);
        });
      });
  </script>
</body>
</html>
