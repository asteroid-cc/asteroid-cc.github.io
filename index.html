<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PKMG Missions</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    header {
      box-sizing: border-box;
      padding: 12px 16px;
      background: #222;
      color: #fff;
      text-align: center;
      font: 600 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .images {
      display: flex;
      width: 100%;
      max-width: 2456px;
      margin: 0 auto;
      align-items: flex-start;
    }

    .images img {
      display: block;
      width: 50%;
      height: auto;
    }
  </style>
</head>
<body>
  <header id="date-banner"></header>
  <main class="images">
    <img id="first-image" width="1228" alt="First image">
    <img id="second-image" width="1228" alt="Second image">
  </main>
  <script>
    const nowGMT8 = new Date(Date.now() + 8 * 60 * 60 * 1000);
    const year = nowGMT8.getUTCFullYear();
    const month = String(nowGMT8.getUTCMonth() + 1).padStart(2, '0');
    const day = String(nowGMT8.getUTCDate()).padStart(2, '0');
    const date = `${year}${month}${day}`;
    const displayedDate = `${year}-${month}-${day}`;

    document.title = displayedDate;
    document.getElementById('date-banner').textContent = displayedDate;
    document.getElementById('first-image').src = `images/${date}.png`;
    document.getElementById('second-image').src = `images/${date}-2.png`;
  </script>
</body>
</html>
