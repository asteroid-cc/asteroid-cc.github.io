<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today's Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    img {
      display: block;
      width: 1228px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <img id="daily-image" width="1228" alt="Today's image">
  <script>
    const nowGMT8 = new Date(Date.now() + 8 * 60 * 60 * 1000);
    const date = nowGMT8.getUTCFullYear().toString()
      + String(nowGMT8.getUTCMonth() + 1).padStart(2, '0')
      + String(nowGMT8.getUTCDate()).padStart(2, '0');

    document.getElementById('daily-image').src = `images/${date}.png`;
  </script>
</body>
</html>
