<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>PKMG Missions</title>
    <!-- Tailwind CSS CDN -->
    <script src="/images/20260928.png"></script>
    <style>
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Support iOS safe area padding for devices with notch/dynamic island */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Hardware accelerated smooth image rendering */
        .tall-image {
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0); /* Force GPU acceleration */
            will-change: transform;
        }

        /* Glassmorphism control panel */
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start overflow-x-hidden">

    <!-- Sticky Glassmorphism Navigation Bar -->
    <header class="fixed top-2 z-50 w-11/12 max-w-md glass-panel rounded-2xl px-4 py-3 shadow-2xl transition-all duration-300">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-xs font-semibold tracking-wide uppercase text-slate-300">1228 × 15696 PNG</span>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Zoom fit toggle button -->
                <button id="zoomToggleBtn" title="Toggle Zoom Mode" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs text-slate-200 transition-all flex items-center space-x-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path>
                    </svg>
                    <span id="zoomLabel" class="hidden sm:inline">Fit Width</span>
                </button>

                <!-- Scroll to Top button -->
                <button id="scrollTopBtn" title="Scroll to Top" class="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Viewport -->
    <main id="container" class="w-full max-w-4xl mx-auto flex flex-col items-center pt-16 pb-12 px-0 transition-all duration-300">
        <!-- Loader Indicator -->
        <div id="loader" class="my-24 flex flex-col items-center space-y-4">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm text-slate-400 font-medium">Loading high-resolution asset...</p>
        </div>

        <!-- PNG Image Container -->
        <div class="relative w-full shadow-2xl flex justify-center">
            <!-- Replace src below with your 1228x15696 PNG path/URL -->
            <img 
                id="tallPngImage"
                src="https://placehold.co/1228x15696/0f172a/6366f1?text=1228+x+15696+PNG+Asset" 
                alt="High Resolution Vertical Image" 
                class="tall-image hidden w-full h-auto block select-none rounded-none sm:rounded-lg"
                loading="eager"
                decoding="async"
                onerror="handleImageError(this)"
            />
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('tallPngImage');
            const loader = document.getElementById('loader');
            const container = document.getElementById('container');
            const zoomBtn = document.getElementById('zoomToggleBtn');
            const zoomLabel = document.getElementById('zoomLabel');
            const scrollTopBtn = document.getElementById('scrollTopBtn');

            let isFullWidth = true;

            // Handle Image Load State
            if (img.complete) {
                onImageLoaded();
            } else {
                img.addEventListener('load', onImageLoaded);
            }

            function onImageLoaded() {
                loader.classList.add('hidden');
                img.classList.remove('hidden');
            }

            // Image load fallback helper
            window.handleImageError = function(image) {
                loader.innerHTML = `
                    <div class="p-6 text-center glass-panel rounded-2xl max-w-xs mx-auto my-12">
                        <svg class="w-10 h-10 text-amber-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <p class="text-sm font-semibold text-slate-200">Image Failed to Load</p>
                        <p class="text-xs text-slate-400 mt-1">Please check the image path in the HTML source code.</p>
                    </div>
                `;
            };

            // Toggle Zoom Modes for comfortable reading
            zoomBtn.addEventListener('click', () => {
                isFullWidth = !isFullWidth;
                if (isFullWidth) {
                    container.classList.remove('max-w-none', 'w-auto');
                    container.classList.add('max-w-4xl', 'w-full');
                    zoomLabel.textContent = 'Fit Width';
                } else {
                    container.classList.remove('max-w-4xl');
                    container.classList.add('max-w-none', 'w-full');
                    zoomLabel.textContent = 'Full Scale';
                }
            });

            // Smooth Scroll to Top
            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
