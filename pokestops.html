.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btns{display:flex;gap:6px}
.btns button{padding:4px 10px;border-radius:6px;border:0;background:#334155;color:var(--tx);cursor:pointer;font-size:.78rem}
.btns button:hover{background:var(--ac);color:#0f172a}
textarea{width:100%;height:110px;resize:vertical;line-height:1.4}
.tbar{display:flex;flex-wrap:wrap;gap:6px}
.tbar:empty{display:none}
.tchip{padding:3px 9px;border-radius:99px;border:1px solid #475569;background:#1e293b;color:#cbd5e1;font-size:.75rem;cursor:pointer;user-select:none}
.tchip:hover{border-color:#facc15;color:#fde047}
.tchip.on{background:rgba(250,204,21,.2);border-color:#facc15;color:#fde047;font-weight:600}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#map{flex:1}
.card{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid #334155;cursor:pointer;transition:.15s}.card:hover{border-color:var(--ac)}.card.on{border-color:#facc15;box-shadow:0 0 0 2px rgba(250,204,21,.3)}
.n{font-weight:600;margin-bottom:4px}.tags{display:flex;flex-wrap:wrap;gap:5px}
.t{display:inline-block;font-size:.7rem;color:var(--ac);background:rgba(56,189,248,.12);padding:2px 8px;border-radius:99px}
.rt{display:inline-block;font-size:.7rem;color:#fde047;background:rgba(250,204,21,.16);border:1px solid rgba(250,204,21,.35);padding:1px 8px;border-radius:99px;font-weight:600}
.c{font-family:ui-monospace,Menlo,monospace;color:var(--mut);margin:6px 0;font-size:.85rem}
.b{display:flex;gap:8px}.b a,.b button{flex:1;text-align:center;text-decoration:none;cursor:pointer;padding:6px;border-radius:8px;border:0;background:#334155;color:var(--tx);font-size:.8rem}.b a:hover,.b button:hover{background:var(--ac);color:#0f172a}
.leaflet-tooltip.rt-tip{background:#0f172a;color:#fde047;border:1px solid #facc15;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.leaflet-tooltip-top.rt-tip::before{border-top-color:#facc15}
@media(max-width:800px){main{flex-direction:column-reverse}#side{width:100%;height:52%;border-right:0;border-top:1px solid #334155}#map{height:48%;flex:none}textarea{height:75px}}

 if(M[i]){if(fly)map.setView(M[i].getLatLng(),Math.max(map.getZoom(),17),{animate:true,duration:0.05});M[i].openPopup()}}
function mk(d,i,tags){
  const m=L.circleMarker([d[1],d[2]],{radius:7,color:'#0f172a',weight:1.5,fillColor:COL[d[3]],fillOpacity:.9}).addTo(layer);
  const tagHtml=tags&&tags.length?'<div style="margin:3px 0;color:#b45309;font-weight:700">'+tags.map(esc).join(' · ')+'</div>':'';
  m.bindPopup(`<b>${esc(d[0])}</b>${tagHtml}${d[1]}, ${d[2]}`);
  if(tags&&tags.length)m.bindTooltip(tags.map(esc).join(' · '),{permanent:true,direction:'top',offset:[0,-8],className:'rt-tip'});
  m.on('click',()=>sel(i,false));M[i]=m;
}
function parseTokens(raw){
  return raw.split(/[\r\n\t,;；、|]+/).map(s=>s
    .replace(/^[\s\-•*·]+/,'')
    .replace(/^\d+[.)、\s]+/,'')
    .replace(/[:：]\s*-?\d+\.\d+\s*,?\s*-?\d*\.?\d*$/,'')
    .trim().toLowerCase()
  ).filter(t=>t.length>=2||D.some(d=>d[0].toLowerCase()===t));
}
function matchSmart(nm,rawLow,tokens){
  if(hasCJK(nm)?nm.length>=2:nm.length>=4){
    if(hasCJK(nm)){if(rawLow.includes(nm))return true}
    else{if(new RegExp('(^|[^a-z0-9])'+reEsc(nm)+'([^a-z0-9]|$)').test(rawLow))return true}
  }
  return tokens.some(t=>nm.includes(t));
}
function parseLines(raw){
  return raw.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
    const m=line.match(/^([^:：]+)[:：]\s*(.+)$/);
    if(m&&!/^-?\d+\.\d+\s*,/.test(m[2].trim())){
      const text=m[2].trim();
      return {tag:m[1].trim(),textLow:text.toLowerCase(),tokens:parseTokens(text)};
    }
    return {tag:'',textLow:line.toLowerCase(),tokens:parseTokens(line)};
  });
}
function encodeState(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}
function decodeState(str){try{return JSON.parse(decodeURIComponent(escape(atob(str))))}catch{return null}}
document.getElementById('shareBtn').onclick=()=>{
  const st={mq:mq.value,q:q.value,a:a.value};
  if(selTags.size)st.t=[...selTags];
  const code=encodeState(st);
  const url=location.href.split('#')[0]+'#f='+code;
  history.replaceState(null,'',url);
  navigator.clipboard.writeText(url).then(()=>{
    const b=document.getElementById('shareBtn');b.textContent='Link Copied ✓';setTimeout(()=>b.textContent='Share Link',1500);
  });
};
function loadFromHash(){
  const m=location.hash.match(/f=([^&]+)/);
  if(m){const st=decodeState(m[1]);if(st){mq.value=st.mq||'';q.value=st.q||'';a.value=st.a||'';if(Array.isArray(st.t))selTags=new Set(st.t)}}
}
function renderTagBar(allTags){
  [...selTags].forEach(t=>{if(!allTags.includes(t))selTags.delete(t)});
  if(!allTags.length){T_.innerHTML='';return}
  T_.innerHTML=`<span class="tchip ${selTags.size===0?'on':''}" data-all="1">All tags</span>`+
    allTags.map(t=>`<span class="tchip ${selTags.has(t)?'on':''}" data-tag="${esc(t)}">${esc(t)}</span>`).join('');
  T_.querySelector('[data-all]').onclick=()=>{selTags.clear();r()};
  T_.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{
    const t=el.dataset.tag;
    if(selTags.has(t))selTags.delete(t);else selTags.add(t);
    r();
  });
}
function r(){
  const k=q.value.trim().toLowerCase(),A=a.value;
  const raw=mq.value.trim();
  const entries=raw?parseLines(raw):[];
  const allTags=[...new Set(entries.map(e=>e.tag).filter(Boolean))];
  renderTagBar(allTags);
  const L=[],tagsById={};
  D.forEach((d,i)=>{
    const nm=d[0].toLowerCase();
    if(A&&d[3]!=A)return;
    if(k&&!nm.includes(k))return;
    if(entries.length){
      let matched=false;const tags=[];
      entries.forEach(e=>{
        if(matchSmart(nm,e.textLow,e.tokens)){
          matched=true;
          if(e.tag&&!tags.includes(e.tag))tags.push(e.tag);
        }
      });
      if(!matched)return;
      if(selTags.size&&!tags.some(t=>selTags.has(t)))return;
      if(tags.length)tagsById[i]=tags;
    }
    L.push(i);
  });
  document.getElementById('cnt').textContent=L.length+' of '+D.length+' stops';
  layer.clearLayers();M={};
  L_.innerHTML=L.map(i=>{
    const d=D[i],tg=tagsById[i]||[];
    const rtHtml=tg.map(t=>`<span class="rt">${esc(t)}</span>`).join('');
    return `<div class="card" id="c${i}" onclick="sel(${i},true)"><div class="n">${esc(d[0])}</div><div class="tags"><span class="t">${esc(d[3])}</span>${rtHtml}</div><div class="c">${d[1].toFixed(6)}, ${d[2].toFixed(6)}</div><div class="b"><button onclick="event.stopPropagation();navigator.clipboard.writeText('${d[1]}, ${d[2]}');this.textContent='Copied ✓';setTimeout(()=>this.textContent='Copy',1200)">Copy</button><a target="_blank" onclick="event.stopPropagation()" href="https://www.google.com/maps?q=${d[1]},${d[2]}">Google Maps</a></div></div>`;
  }).join('');
  const pts=[];L.forEach(i=>{mk(D[i],i,tagsById[i]);pts.push([D[i][1],D[i][2]])});
  if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:17});
}
document.getElementById('clr').onclick=()=>{selTags.clear();mq.value='';q.value='';a.value='';history.replaceState(null,'',location.href.split('#')[0]);r()};
q.oninput=mq.oninput=a.onchange=r;
loadFromHash();r();</script></body></html>
